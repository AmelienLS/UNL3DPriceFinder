name: Build & Release

on:
  push:
    branches: [main]
    tags:
      - "v*"

jobs:
  build-macos:
    name: macOS (DMG)
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install npm dependencies
        run: npm ci

      - name: Build Tauri app
        run: npm run tauri build

      - name: Ad-hoc sign the .app
        run: |
          APP="src-tauri/target/release/bundle/macos/UNL3D Prix.app"
          xattr -cr "$APP"
          codesign --force --deep --sign - "$APP"

      - name: Read version
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Recreate signed DMG
        run: |
          APP="src-tauri/target/release/bundle/macos/UNL3D Prix.app"
          DMG="src-tauri/target/release/bundle/dmg/UNL3D Prix_${{ steps.version.outputs.version }}_aarch64.dmg"
          rm -f "$DMG"
          hdiutil create -volname "UNL3D Prix" -srcfolder "$APP" -ov -format UDZO "$DMG"

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: UNL3D-Prix-${{ steps.version.outputs.version }}-macos
          path: "src-tauri/target/release/bundle/dmg/*.dmg"
          retention-days: 30

      - name: Create GitHub Release (macOS)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: "src-tauri/target/release/bundle/dmg/*.dmg"
          generate_release_notes: true

  build-windows:
    name: Windows (NSIS .exe)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install npm dependencies
        run: npm ci

      - name: Build Tauri app
        run: npm run tauri build

      - name: Read version
        id: version
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: UNL3D-Prix-${{ steps.version.outputs.version }}-windows
          path: "src-tauri/target/release/bundle/nsis/*.exe"
          retention-days: 30

      - name: Create GitHub Release (Windows)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: "src-tauri/target/release/bundle/nsis/*.exe"
