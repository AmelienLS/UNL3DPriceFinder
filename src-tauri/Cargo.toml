[package]
name = "unl3d-prix"
version = "1.0.0"
description = "Calculateur de prix d'impression 3D"
authors = ["UNL3D"]
edition = "2021"

[lib]
name = "unl3d_prix_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
